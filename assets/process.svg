<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 190" width="960" height="190" role="img" aria-label="How I run an AI project: 1 sit with the team, 2 pick the use case, 3 build it, 4 stay until it is used."><rect width="960" height="190" rx="14" fill="#0B0B0C"/><circle cx="41" cy="48" r="15" fill="#FF5B14"/><text x="41" y="54" text-anchor="middle" style="font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#0B0B0C">1</text><text x="26" y="100" style="font:600 20px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.4px" fill="#EFECE6">Sit with the team</text><text x="26" y="130" style="font:400 15.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#B5B2AA">Map the process with the</text><text x="26" y="151" style="font:400 15.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#B5B2AA">people who do the work</text><line x1="70" y1="48" x2="262" y2="48" stroke="#26262A" stroke-width="1.5"/><circle cx="281" cy="48" r="15" fill="#FF5B14"/><text x="281" y="54" text-anchor="middle" style="font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#0B0B0C">2</text><text x="266" y="100" style="font:600 20px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.4px" fill="#EFECE6">Pick the use case</text><text x="266" y="130" style="font:400 15.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#B5B2AA">Choose what is worth</text><text x="266" y="151" style="font:400 15.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#B5B2AA">automating and what is not</text><line x1="310" y1="48" x2="502" y2="48" stroke="#26262A" stroke-width="1.5"/><circle cx="521" cy="48" r="15" fill="#FF5B14"/><text x="521" y="54" text-anchor="middle" style="font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#0B0B0C">3</text><text x="506" y="100" style="font:600 20px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.4px" fill="#EFECE6">Build it</text><text x="506" y="130" style="font:400 15.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#B5B2AA">On the real data, wired to</text><text x="506" y="151" style="font:400 15.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#B5B2AA">the systems they have</text><line x1="550" y1="48" x2="742" y2="48" stroke="#26262A" stroke-width="1.5"/><circle cx="761" cy="48" r="15" fill="#FF5B14"/><text x="761" y="54" text-anchor="middle" style="font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#0B0B0C">4</text><text x="746" y="100" style="font:600 20px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.4px" fill="#EFECE6">Stay until it is used</text><text x="746" y="130" style="font:400 15.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#B5B2AA">Change it with the team,</text><text x="746" y="151" style="font:400 15.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#B5B2AA">then hand it over</text></svg>